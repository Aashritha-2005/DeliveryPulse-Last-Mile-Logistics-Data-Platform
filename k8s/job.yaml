{
  "apiVersion": "batch/v1",
  "kind": "Job",
  "metadata": {
    "generateName": "deliverypulse-",
    "namespace": "deliverypulse"
  },
  "spec": {
    "backoffLimit": 1,
    "activeDeadlineSeconds": 900,
    "ttlSecondsAfterFinished": 3600,
    "template": {
      "metadata": {
        "labels": {
          "app": "deliverypulse-pipeline"
        }
      },
      "spec": {
        "restartPolicy": "Never",
        "automountServiceAccountToken": false,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 10001,
          "runAsGroup": 10001,
          "fsGroup": 10001,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "initContainers": [
          {
            "name": "generate",
            "image": "deliverypulse-pipeline:unbuilt",
            "imagePullPolicy": "Never",
            "args": [
              "generate"
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "500m",
                "memory": "512Mi",
                "ephemeral-storage": "512Mi"
              },
              "limits": {
                "cpu": "2",
                "memory": "1536Mi",
                "ephemeral-storage": "2Gi"
              }
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/work"
              },
              {
                "name": "tmp",
                "mountPath": "/tmp"
              }
            ]
          }
        ],
        "containers": [
          {
            "name": "pipeline",
            "image": "deliverypulse-pipeline:unbuilt",
            "imagePullPolicy": "Never",
            "args": [
              "pipeline"
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "500m",
                "memory": "512Mi",
                "ephemeral-storage": "512Mi"
              },
              "limits": {
                "cpu": "2",
                "memory": "1536Mi",
                "ephemeral-storage": "2Gi"
              }
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/work"
              },
              {
                "name": "tmp",
                "mountPath": "/tmp"
              }
            ],
            "envFrom": [
              {
                "configMapRef": {
                  "name": "deliverypulse-config"
                }
              },
              {
                "secretRef": {
                  "name": "deliverypulse-db"
                }
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "data",
            "emptyDir": {
              "sizeLimit": "1536Mi"
            }
          },
          {
            "name": "tmp",
            "emptyDir": {
              "sizeLimit": "128Mi"
            }
          }
        ]
      }
    }
  }
}
