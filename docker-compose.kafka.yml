# Local synthetic-data streaming demo. Layer on docker-compose.yml; core needs no Kafka vars.
# The multi-platform index digest was confirmed by the user on 2026-10-15.
x-kafka-image: &kafka-image apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837

services:
  kafka:
    image: *kafka-image
    profiles: [streaming]
    # The upstream image runs as appuser and owns /var/lib/kafka/data.
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?set KAFKA_CLUSTER_ID in .env}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://127.0.0.1:${KAFKA_PORT:?set KAFKA_PORT in .env}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_LOG_RETENTION_HOURS: "1"
      KAFKA_LOG_SEGMENT_BYTES: "16777216"
      KAFKA_LOG_ROLL_MS: "60000"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "30000"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      # PLAINTEXT is an explicit local-demo choice; no host-wide listener.
      - "127.0.0.1:${KAFKA_PORT:?set KAFKA_PORT in .env}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_config:/mnt/shared/config
      - kafka_secrets:/etc/kafka/secrets
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s

  kafka-topics:
    image: *kafka-image
    profiles: [streaming]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC_ORDERS: ${KAFKA_TOPIC_ORDERS:?set KAFKA_TOPIC_ORDERS in .env}
      KAFKA_TOPIC_PINGS: ${KAFKA_TOPIC_PINGS:?set KAFKA_TOPIC_PINGS in .env}
      KAFKA_TOPIC_DLQ: ${KAFKA_TOPIC_DLQ:?set KAFKA_TOPIC_DLQ in .env}
      KAFKA_HEAP_OPTS: -Xms32m -Xmx128m
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        for topic in "$$KAFKA_TOPIC_ORDERS" "$$KAFKA_TOPIC_PINGS" "$$KAFKA_TOPIC_DLQ"; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1 \
            --config cleanup.policy=delete --config retention.ms=3600000 \
            --config retention.bytes=268435456 --config segment.bytes=16777216 \
            --config segment.ms=60000
        done
    restart: "no"
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  kafka_data:
    name: deliverypulse_kafka_data
  kafka_config:
    name: deliverypulse_kafka_config
  kafka_secrets:
    name: deliverypulse_kafka_secrets
