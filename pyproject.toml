[project]
name = "deliverypulse"
version = "0.1.0"
description = "Last-mile logistics data platform: idempotent ETL, data quality and SQL analytics on synthetic delivery data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
# Runtime dependencies only; development tools are in the dev group below.
dependencies = [
    "boto3==1.43.99",
    "botocore==1.43.106",
    "numpy>=2.1",
    "psycopg[binary]>=3.2",
    "pyarrow>=17.0",
    "python-dotenv>=1.0",
    "streamlit==1.64.0",
]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "bandit>=1.9.4",
    "mypy>=1.13",
    "pip-audit>=2.10.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
# Benchmark engines (scripts/benchmark.py): installed only with `uv sync --locked --group bench`,
# never by a plain `uv sync --locked` or in the Airflow image. PySpark needs Java 21.
bench = [
    "pandas==3.0.6",
    "psutil==7.2.2",
    "pyspark==4.2.0",
]

[tool.uv]
# Not an installable package: code is run from the project root via `uv run`.
package = false
# Only use uv-managed Pythons; never Homebrew, python.org, pyenv or Apple Pythons.
python-preference = "only-managed"

# ---------------------------------------------------------------- ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# pytest relies on plain `assert` statements.
"tests/**/*.py" = ["S101"]

# ---------------------------------------------------------------- mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# pyarrow, boto3, botocore and pandas ship without type information here; their objects are
# treated as Any. PySpark ships its own type hints and is checked.
[[tool.mypy.overrides]]
module = [
    # Airflow is installed only inside the Airflow image, where scripts/airflow_dag_check.py runs.
    "airflow",
    "airflow.*",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "pandas",
    "pandas.*",
    "psutil",
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true

# -------------------------------------------------------------- pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast tests with no external services (no database, no Docker)",
    "integration: tests that need running services such as PostgreSQL",
    "s3: tests that need PostgreSQL and the local object store (make up, make s3-up)",
    "spark: tests that need a Java 21 runtime and the bench dependency group (make test-spark)",
]
