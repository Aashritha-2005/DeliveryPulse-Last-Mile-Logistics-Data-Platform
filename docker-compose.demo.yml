{
  "name": "deliverypulse-demo",
  "services": {
    "postgres": {
      "image": "postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336",
      "environment": {
        "POSTGRES_USER": "${POSTGRES_SUPERUSER:?set the core administrator name locally}",
        "POSTGRES_PASSWORD": "${POSTGRES_SUPERUSER_PASSWORD:?set the core administrator password locally}",
        "POSTGRES_DB": "deliverypulse_demo",
        "DELIVERYPULSE_ETL_PASSWORD": "${DELIVERYPULSE_ETL_PASSWORD:?set the ETL password locally}",
        "DELIVERYPULSE_READONLY_PASSWORD": "${DELIVERYPULSE_READONLY_PASSWORD:?set the read-only password locally}",
        "TZ": "UTC",
        "PGTZ": "UTC"
      },
      "ports": [
        "127.0.0.1:${DEMO_PORT:-55432}:5432"
      ],
      "volumes": [
        "demo_pgdata:/var/lib/postgresql",
        "./docker/postgres/init-deliverypulse.sh:/docker-entrypoint-initdb.d/10-init-deliverypulse.sh:ro",
        "./sql:/deliverypulse/sql:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d deliverypulse_demo"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12,
        "start_period": "30s"
      },
      "mem_limit": "1g",
      "shm_size": "256mb",
      "cap_drop": [
        "ALL"
      ],
      "cap_add": [
        "CHOWN",
        "DAC_OVERRIDE",
        "FOWNER",
        "SETGID",
        "SETUID"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "stop_grace_period": "30s"
    }
  },
  "volumes": {
    "demo_pgdata": {
      "name": "deliverypulse_demo_pgdata"
    }
  }
}
