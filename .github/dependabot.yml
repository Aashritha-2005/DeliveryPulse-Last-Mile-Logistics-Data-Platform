# Weekly dependency updates: GitHub Actions (SHA pins), Python (uv.lock) and the Compose image.
# The digest-pinned PostgreSQL image in the workflows is updated by hand when the Compose tag
# changes (see docs/operations.md, "Updating pins").
#
# Cooldown: a new release is proposed only once it is at least 14 days old, which leaves time
# for a broken or compromised release to be withdrawn before it reaches this repository.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
