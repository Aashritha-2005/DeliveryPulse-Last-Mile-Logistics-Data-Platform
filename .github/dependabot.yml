# Weekly dependency updates: GitHub Actions (SHA pins), Python (uv.lock), the Compose images and
# the Airflow Dockerfile. The digest pins repeated in the workflows and in
# docker-compose.airflow.yml are updated by hand to match (see docs/operations.md, "Updating pins").
#
# Cooldown: a new release is proposed only once it is at least 14 days old, which leaves time
# for a broken or compromised release to be withdrawn before it reaches this repository.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  # The Airflow image's FROM lines (apache/airflow and the uv binary image, both digest-pinned).
  - package-ecosystem: docker
    directory: /docker/airflow
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /docker/pipeline
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  # Provider pins of the one-off AWS proof (infra/aws).
  - package-ecosystem: terraform
    directory: /infra/aws
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
