# Lint, type check, unit tests, integration tests with coverage, and the determinism check.
#
# Least privilege: read-only token, no repository secrets. The database passwords are generated
# inside the integration job and masked; they never exist in the repository.
# Every third-party action is pinned to a full commit SHA (version in the comment), and the
# PostgreSQL and Airflow images are pinned by digest. How to verify and update pins: docs/operations.md.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint, format check and mypy (make lint)
        run: make lint
      - name: Validate workflows and Dependabot config (make actionlint)
        run: make actionlint

  unit:
    name: Unit tests (no services)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Unit tests (make test)
        run: make test

  integration:
    name: Integration tests and coverage (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # postgres:18.6-trixie, pinned to its multi-architecture index digest.
      POSTGRES_IMAGE: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Create a core-only .env (no AIRFLOW_ or S3_ variables) with generated, masked passwords
        run: |
          # The AIRFLOW_ and S3_ lines are deleted on purpose: the next step proves the core stack
          # starts without them (those services live in docker-compose.airflow.yml and
          # docker-compose.s3.yml).
          grep -v -E '^(AIRFLOW_|S3_)' .env.example > .env
          for name in POSTGRES_SUPERUSER_PASSWORD DELIVERYPULSE_ETL_PASSWORD DELIVERYPULSE_READONLY_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            sed -i "s/^${name}=CHANGE_ME\$/${name}=${value}/" .env
          done
          if grep -q 'CHANGE_ME' .env; then
            echo "A CHANGE_ME placeholder is left in .env" >&2
            exit 1
          fi
          if grep -q -E '^(AIRFLOW_|S3_)' .env; then
            echo "The core-only .env must not contain AIRFLOW_ or S3_ variables" >&2
            exit 1
          fi
      - name: Start PostgreSQL without any AIRFLOW_ or S3_ variable (make up)
        run: make up
      - name: Integration tests (make test-integration)
        run: make test-integration
      - name: Coverage, unit + integration, gate 80 % (make coverage)
        run: make coverage
      - name: PostgreSQL container logs (on failure)
        if: failure()
        run: docker compose --profile core logs postgres
      - name: Stop PostgreSQL (make down)
        if: always()
        run: make down

  airflow-dag:
    name: Airflow DAG parse check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create .env with generated, masked values (no object-store variables)
        run: |
          grep -v '^S3_' .env.example > .env
          for name in POSTGRES_SUPERUSER_PASSWORD DELIVERYPULSE_ETL_PASSWORD DELIVERYPULSE_READONLY_PASSWORD \
                      AIRFLOW_DB_PASSWORD AIRFLOW_FERNET_KEY AIRFLOW_JWT_SECRET; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            sed -i "s/^${name}=CHANGE_ME\$/${name}=${value}/" .env
          done
          sed -i "s/^AIRFLOW_UID=.*/AIRFLOW_UID=$(id -u)/" .env
          if grep -q 'CHANGE_ME' .env; then
            echo "A CHANGE_ME placeholder is left in .env" >&2
            exit 1
          fi
      - name: Parse and verify the DAG in the pinned Airflow image (make airflow-dag-check)
        run: make airflow-dag-check

  object-store:
    name: Object store tests (SeaweedFS, PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # postgres:18.6-trixie, pinned to its multi-architecture index digest.
      POSTGRES_IMAGE: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Create .env with generated, masked passwords and keys (no AIRFLOW_ variables)
        run: |
          grep -v '^AIRFLOW_' .env.example > .env
          for name in POSTGRES_SUPERUSER_PASSWORD DELIVERYPULSE_ETL_PASSWORD DELIVERYPULSE_READONLY_PASSWORD \
                      S3_ADMIN_ACCESS_KEY S3_ADMIN_SECRET_KEY S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            sed -i "s/^${name}=CHANGE_ME\$/${name}=${value}/" .env
          done
          if grep -q 'CHANGE_ME' .env; then
            echo "A CHANGE_ME placeholder is left in .env" >&2
            exit 1
          fi
      - name: Start PostgreSQL (make up)
        run: make up
      - name: Start the object store and create the bucket (make s3-up)
        run: make s3-up
      - name: Tests against the live object store (make test-s3)
        run: make test-s3
      - name: Object store logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.s3.yml --profile s3 logs
      - name: Stop the object store and PostgreSQL
        if: always()
        run: make s3-down && make down

  determinism:
    name: Determinism check (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Generate twice and compare sha256 (make generate-check)
        run: make generate-check ORDERS=1500 SEED=7
