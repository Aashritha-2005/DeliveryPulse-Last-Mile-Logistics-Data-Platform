# Lint, type check, unit tests, integration tests with coverage, and the determinism check.
#
# Least privilege: read-only token, no repository secrets. The database passwords are generated
# inside the integration job and masked; they never exist in the repository.
# Every third-party action is pinned to a full commit SHA (version in the comment), and the
# PostgreSQL and Airflow images are pinned by digest. How to verify and update pins: docs/operations.md.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked dependencies, including the benchmark engines
        # The bench group is installed so mypy also checks src/bench and scripts/benchmark.py.
        run: uv sync --locked --group bench --group streaming --group nosql
      - name: Lint, format check and mypy (make lint)
        run: make lint
      - name: Validate workflows and Dependabot config (make actionlint)
        run: make actionlint

  unit:
    name: Unit tests (no services)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Unit tests (make test)
        run: make test

  integration:
    name: Integration tests and coverage (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # postgres:18.6-trixie, pinned to its multi-architecture index digest.
      POSTGRES_IMAGE: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Create a core-only .env (no AIRFLOW_ or S3_ variables) with generated, masked passwords
        run: |
          # The AIRFLOW_ and S3_ lines are deleted on purpose: the next step proves the core stack
          # starts without them (those services live in docker-compose.airflow.yml and
          # docker-compose.s3.yml).
          grep -v -E '^(AIRFLOW_|S3_|KAFKA_|MONGO_)' .env.example > .env
          for name in POSTGRES_SUPERUSER_PASSWORD DELIVERYPULSE_ETL_PASSWORD DELIVERYPULSE_READONLY_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            sed -i "s/^${name}=CHANGE_ME\$/${name}=${value}/" .env
          done
          if grep -q 'CHANGE_ME' .env; then
            echo "A CHANGE_ME placeholder is left in .env" >&2
            exit 1
          fi
          if grep -q -E '^(AIRFLOW_|S3_|KAFKA_)' .env; then
            echo "The core-only .env must not contain AIRFLOW_ or S3_ variables" >&2
            exit 1
          fi
      - name: Start PostgreSQL without any AIRFLOW_ or S3_ variable (make up)
        run: make up
      - name: Integration tests (make test-integration)
        run: make test-integration
      - name: Coverage, unit + integration, gate 80 % (make coverage)
        run: make coverage
      - name: PostgreSQL container logs (on failure)
        if: failure()
        run: docker compose --profile core logs postgres
      - name: Stop PostgreSQL (make down)
        if: always()
        run: make down

  airflow-dag:
    name: Airflow DAG parse check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create .env with generated, masked values (no object-store variables)
        run: |
          grep -v -E '^(S3_|KAFKA_|MONGO_)' .env.example > .env
          for name in POSTGRES_SUPERUSER_PASSWORD DELIVERYPULSE_ETL_PASSWORD DELIVERYPULSE_READONLY_PASSWORD \
                      AIRFLOW_DB_PASSWORD AIRFLOW_FERNET_KEY AIRFLOW_JWT_SECRET; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            sed -i "s/^${name}=CHANGE_ME\$/${name}=${value}/" .env
          done
          sed -i "s/^AIRFLOW_UID=.*/AIRFLOW_UID=$(id -u)/" .env
          if grep -q 'CHANGE_ME' .env; then
            echo "A CHANGE_ME placeholder is left in .env" >&2
            exit 1
          fi
      - name: Parse and verify the DAG in the pinned Airflow image (make airflow-dag-check)
        run: make airflow-dag-check

  terraform:
    # Static checks only: no AWS credentials exist in CI and nothing is planned or applied.
    name: Terraform format and validate (AWS proof)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Check formatting
        run: terraform -chdir=infra/aws fmt -check -recursive
      - name: Initialise providers without a backend
        run: terraform -chdir=infra/aws init -backend=false -input=false
      - name: Validate the configuration
        run: terraform -chdir=infra/aws validate

  object-store:
    name: Object store tests (SeaweedFS, PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # postgres:18.6-trixie, pinned to its multi-architecture index digest.
      POSTGRES_IMAGE: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Create .env with generated, masked passwords and keys (no AIRFLOW_ variables)
        run: |
          grep -v -E '^(AIRFLOW_|KAFKA_|MONGO_)' .env.example > .env
          for name in POSTGRES_SUPERUSER_PASSWORD DELIVERYPULSE_ETL_PASSWORD DELIVERYPULSE_READONLY_PASSWORD \
                      S3_ADMIN_ACCESS_KEY S3_ADMIN_SECRET_KEY S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            sed -i "s/^${name}=CHANGE_ME\$/${name}=${value}/" .env
          done
          if grep -q 'CHANGE_ME' .env; then
            echo "A CHANGE_ME placeholder is left in .env" >&2
            exit 1
          fi
      - name: Start PostgreSQL (make up)
        run: make up
      - name: Start the object store and create the bucket (make s3-up)
        run: make s3-up
      - name: Tests against the live object store (make test-s3)
        run: make test-s3
      - name: Object store logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.s3.yml --profile s3 logs
      - name: Stop the object store and PostgreSQL
        if: always()
        run: make s3-down && make down

  spark:
    name: Benchmark engines (pandas vs PySpark)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked dependencies, including the benchmark engines
        run: uv sync --locked --group bench
      - name: Equivalence tests with the runner's Java 21 (make test-spark)
        # The Makefile resolves JAVA_HOME with java_home -v 21, which exists on macOS only; on
        # Linux the runner's preinstalled Temurin 21 is used directly. Both run the same tests.
        run: JAVA_HOME="${JAVA_HOME_21_X64}" uv run --group bench pytest -m spark

  kafka:
    name: Kafka streaming (PostgreSQL landing and replay)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked streaming group
        run: uv sync --locked --group streaming
      - name: Configure local services
        run: |
          grep -v -E '^(AIRFLOW_|S3_|MONGO_)' .env.example > .env
          cluster_id="$(uv run python -c 'import base64, uuid; print(base64.urlsafe_b64encode(uuid.uuid4().bytes).decode("ascii").rstrip("="))')"
          sed -i "s/^KAFKA_CLUSTER_ID=CHANGE_ME\$/KAFKA_CLUSTER_ID=${cluster_id}/" .env
          for name in POSTGRES_SUPERUSER_PASSWORD DELIVERYPULSE_ETL_PASSWORD DELIVERYPULSE_READONLY_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            sed -i "s/^${name}=CHANGE_ME\$/${name}=${value}/" .env
          done
      - name: Start PostgreSQL and Kafka
        run: make up && make kafka-up
      - name: Verify stream delivery and replay
        run: make test-kafka
      - name: Broker diagnostics
        if: failure()
        run: make kafka-logs
      - name: Stop services, preserving volumes
        if: always()
        run: make kafka-down && make down

  mongo:
    name: NoSQL tests (MongoDB raw store and SQL comparison)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked optional client
        run: uv sync --locked --group nosql
      - name: Configure isolated local services
        run: |
          grep -v -E '^(AIRFLOW_|S3_|KAFKA_)' .env.example > .env
          for role in ROOT APP READONLY; do
            sed -i "s/^MONGO_${role}_USER=CHANGE_ME\$/MONGO_${role}_USER=mongo_$(echo "${role}" | tr '[:upper:]' '[:lower:]')/" .env
          done
          for name in POSTGRES_SUPERUSER_PASSWORD DELIVERYPULSE_ETL_PASSWORD DELIVERYPULSE_READONLY_PASSWORD MONGO_ROOT_PASSWORD MONGO_APP_PASSWORD MONGO_READONLY_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::${value}"
            sed -i "s/^${name}=CHANGE_ME\$/${name}=${value}/" .env
          done
          if grep -q CHANGE_ME .env; then
            echo "An environment placeholder remains" >&2
            exit 1
          fi
      - name: Start services and load PostgreSQL fixture
        run: |
          make up
          make mongo-up
          make generate ORDERS=1500 SEED=7
          make load
      - name: Verify immutable loading, roles and SQL equivalence
        run: |
          make test-mongo
          make mongo-load
          make mongo-load
          make mongo-query
      - name: Stop services, preserving volumes
        if: always()
        run: make mongo-down && make down

  determinism:
    name: Determinism check (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Generate twice and compare sha256 (make generate-check)
        run: make generate-check ORDERS=1500 SEED=7
