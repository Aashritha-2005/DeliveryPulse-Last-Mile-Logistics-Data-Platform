# Minimal hooks: ruff only. Not installed or activated by default (`pre-commit install`).
# Local hooks reuse the ruff version locked in uv.lock (no second ruff copy).
# Secret scanning runs through `make scan` (gitleaks), not as a hook.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
