# DeliveryPulse core services. Start only the profile you need (memory per profile:
# docs/operations.md):
#   core:    PostgreSQL analytics store (this file)
#   airflow: Airflow 3 and its metadata database, in docker-compose.airflow.yml, which is
#            layered on top of this file by the `make airflow-*` targets
# This file never references an Airflow variable, so the core stack runs without them.
# Never run several heavy profiles at once on an 8 GB machine.
#
# All credentials come from .env (git-ignored). `${VAR:?message}` makes Compose refuse to
# start when a required variable is missing, instead of silently using an empty value.

name: deliverypulse

services:
  postgres:
    # Exact patch release on an explicit Debian base; publishes linux/arm64.
    # CI sets POSTGRES_IMAGE to the same tag pinned by digest (.github/workflows/tests.yml).
    image: ${POSTGRES_IMAGE:-postgres:18.6-trixie}
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?set POSTGRES_SUPERUSER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Read only by docker/postgres/init-deliverypulse.sh on first initialisation.
      DELIVERYPULSE_ETL_PASSWORD: ${DELIVERYPULSE_ETL_PASSWORD:?set DELIVERYPULSE_ETL_PASSWORD in .env}
      DELIVERYPULSE_READONLY_PASSWORD: ${DELIVERYPULSE_READONLY_PASSWORD:?set DELIVERYPULSE_READONLY_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Localhost only; never 0.0.0.0.
      - "127.0.0.1:${POSTGRES_PORT:?set POSTGRES_PORT in .env}:5432"
    volumes:
      # PostgreSQL 18+ images keep data in PGDATA=/var/lib/postgresql/18/docker and expect
      # the volume at /var/lib/postgresql (not the pre-18 /var/lib/postgresql/data).
      - pgdata:/var/lib/postgresql
      # Only the init script goes into /docker-entrypoint-initdb.d, so the entrypoint
      # cannot run the .sql files itself or in the wrong order.
      - ./docker/postgres/init-deliverypulse.sh:/docker-entrypoint-initdb.d/10-init-deliverypulse.sh:ro
      - ./sql:/deliverypulse/sql:ro
    healthcheck:
      # TCP check on 127.0.0.1: during first initialisation the temporary server listens on
      # the Unix socket only, so the service turns healthy only after init has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    shm_size: 256mb
    # Drop all capabilities, then re-add only what the official entrypoint needs to
    # fix data-directory ownership and switch to the unprivileged postgres user.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  pgdata:
    # Explicit name so `make reset-db` removes exactly this volume.
    name: deliverypulse_pgdata
